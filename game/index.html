<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Саунклауд реп</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="controls">
    <div id="dpad">
        <button class="btn" data-key="KeyW" id="up">▲</button>
        <button class="btn" data-key="KeyA" id="left">◀</button>
        <button class="btn" data-key="KeyD" id="right">▶</button>
        <button class="btn" data-key="KeyS" id="down">▼</button>
    </div>
    <button class="btn" data-key="KeyE" id="action">E</button>
    </div>
  <script src="game.js"></script>
</body>
</html>
