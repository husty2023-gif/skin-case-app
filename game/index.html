<!DOCTYPE html>
<html lang="ru">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
        <title>Династия</title>
        <style>
            body { margin: 0; background: #111; }
            canvas { display: block; background: #87ceeb; width: 100%; max-width: 800px; margin: 0 auto; }
        </style>
    </head>
    <body>
        <canvas id="game" width="800" height="450"></canvas>
        <script>
            const canvas = document.getElementById("game");
            const ctx = canvas.getContext("2d");

            const keys = {};
            window.addEventListener("keydown", (e) => {
                keys[e.code] = true;
                if (e.code === "Space") e.preventDefault();
            });
            window.addEventListener("keyup", (e) => { keys[e.code] = false });

            const madk1d = {x: 100, y: 300, w:40, h: 60, vy:0};
            const groundY = 400;

            function loop() {
                if (keys["KeyD"]) madk1d.x +=4;
                if (keys["KeyA"]) madk1d.x -=4;

                madk1d.vy += 0.6;
                madk1d.y += madk1d.vy;

                let onGround = false;
                if (madk1d.y + madk1d.h >= groundY) {
                    madk1d.y = groundY - madk1d.h;
                    madk1d.vy = 0;
                    onGround = true;
                }

                if (keys["Space"] && onGround) madk1d.vy = -13;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#4a3";
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                ctx.fillStyle = "red";
                ctx.fillRect(madk1d.x, madk1d.y, madk1d.w, madk1d.h);
                
                requestAnimationFrame(loop);
            }
            
            loop();
        </script>
    </body>
</html>
